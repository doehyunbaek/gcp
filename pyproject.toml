[project]
name = "gcp"
version = "0.3.0"
description = "A uvx-friendly CLI for syncing local files with GitHub repository files"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "gcp contributors" }]
dependencies = []

[project.scripts]
gcp = "gcp.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcp"]
