[project]
name = "gitcp"
version = "0.3.1"
description = "A uvx-friendly CLI for syncing local files with GitHub repository files"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "gitcp contributors" }]
dependencies = []

[project.scripts]
gitcp = "gitcp.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitcp"]
